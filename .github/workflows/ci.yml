# CI pipeline — triggered on every PR against develop/master, and publishes
# a container image to GHCR on merge to master.
# TODO: build & test the frontend (npm run build / vitest) once that's in scope.
name: CI
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/ShopHub.slnx

      - name: Build
        run: dotnet build backend/ShopHub.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test backend/tests/ShopHub.Api.Tests/ShopHub.Api.Tests.csproj --no-build --configuration Release

      # Testcontainers spins up a real Postgres container per run; ubuntu-latest runners
      # have Docker available out of the box, no extra setup needed.
      - name: Integration tests
        run: dotnet test backend/tests/ShopHub.Api.IntegrationTests/ShopHub.Api.IntegrationTests.csproj --no-build --configuration Release

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
