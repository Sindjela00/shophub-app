# CI pipeline — triggered on every PR against develop/master, and publishes
# a container image to GHCR on merge to master.
name: CI
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/ShopHub.slnx

      - name: Build
        run: dotnet build backend/ShopHub.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test backend/tests/ShopHub.Api.Tests/ShopHub.Api.Tests.csproj --no-build --configuration Release

      # Testcontainers spins up a real Postgres container per run; ubuntu-latest runners
      # have Docker available out of the box, no extra setup needed.
      - name: Integration tests
        run: dotnet test backend/tests/ShopHub.Api.IntegrationTests/ShopHub.Api.IntegrationTests.csproj --no-build --configuration Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Same build the Docker image's frontend-build stage runs — catches frontend build
      # breakage (including the tsc -b type-check it includes) at PR time, not just at publish.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root, not backend/ — the Dockerfile's frontend-build stage needs frontend/ in
          # the build context too now. The Dockerfile itself stays at backend/Dockerfile.
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
