# Local development infrastructure. Matches backend/src/ShopHub.Api/appsettings.Development.json.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shophub
      POSTGRES_USER: shophub
      POSTGRES_PASSWORD: shophub
    ports:
      - "5433:5432"
    volumes:
      - shophub-postgres-data:/var/lib/postgresql/data

volumes:
  shophub-postgres-data:
